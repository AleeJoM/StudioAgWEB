name: CI / Deploy a GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**', '.cursor/**', '.agents/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio por defecto; cada job pide solo lo que usa.
permissions:
  contents: read

jobs:
  build:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # En PRs se cancela la corrida vieja si llega un push nuevo.
    concurrency:
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Configurar Pages (base path)
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # "/StudioAgWEB/" en github.io; "/" si se configura un dominio propio.
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/

      - name: Fallback 404 para SPA
        run: cp dist/index.html dist/404.html

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Nunca cancelar un deploy en curso: se encolan y gana el último.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
